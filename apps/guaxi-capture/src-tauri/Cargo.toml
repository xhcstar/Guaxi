[package]
name = "guaxi-capture"
version = "0.1.0"
description = "Guaxi Capture App"
authors = ["Guaxi"]
edition = "2021"

[lib]
name = "guaxi_capture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
