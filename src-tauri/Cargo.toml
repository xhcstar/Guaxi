[package]
name = "guaxi"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "guaxi"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "guaxi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }
zip = "6.0.0"

[profile.release]
debug = true

[dependencies]
tauri = { version = "2.9.5", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "stream", "multipart"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
regex = "1.11.1"
chrono = "0.4.39"
rand = "0.9.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["fmt", "time", "local-time", "json", "env-filter"] }
tracing-appender = "0.2.3"
tauri-plugin-dialog = "2"
pyo3 = "0.23.5"
rusqlite = { version = "0.34.0", features = ["bundled"] }
tauri-plugin-os = "2"
urlencoding = "2.1.3"
base64 = "0.22.1"
tauri-plugin-fs = "2"
pdfium-render = "0.8.29"
pdf-extract = "0.7.8"
lopdf = "0.34.0"
image = "0.25.6"
tauri-plugin-clipboard-manager = "2"
notify = "8.0.0"
actix-web = "4.10.2"
actix-web-actors = "4.2.0"
actix = "0.13.5"
mime_guess = "2.0.5"
actix-cors = "0.7.1"
lazy_static = "1.5.0"
anyhow = "1.0.97"
tauri-plugin-global-shortcut = "2.0.0"
sha2 = "0.10.9"
svg = "0.18.0"
fs_extra = "1.3.0"
hmac = "0.12.1"
hex = "0.4.3"
mockito = "1.7.0"
ignore = "0.4.23"
walkdir = "2.5.0"
grep-searcher = "0.1.14"
grep-regex = "0.1.13"
grep-matcher = "0.1.7"
rayon = "1.10.0"
parking_lot = "0.12.4"
lru = "0.16.0"
uuid = { version = "1.17.0", features = ["v4"] }
git2 = "0.20.2"
encoding_rs = "0.8.35"
zip = "6.0.0"
flate2 = "1.0.30"
tar = "0.4.44"
comrak = "0.49.0"
fuzzy-matcher = "0.3.7"
once_cell = "1.21.3"
rss = "2.0.12"
url = "2.5.7"
exif = { git = "https://github.com/kamadak/exif-rs", package = "exif" }
scraper = "0.25.0"
aes-gcm = "0.10.3"
trash = "5.2.5"
rquickjs = "0.11.0"
tempfile = "3.25.0"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }
