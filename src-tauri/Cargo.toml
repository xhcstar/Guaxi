[package]
name = "guaxi"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "guaxi"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "guaxi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 国密 TLCP / SM2 / PQC：默认关闭。启用：OPENSSL_DIR=/opt/tongsuo85 cargo build --features tlcp
[features]
tlcp = ["dep:openssl", "dep:openssl-sys"]
# 语音默认走 CPU 静态库：自包含、免分发 DLL，任何机器都能构建。
default = ["sherpa-onnx/static"]
# GPU（CUDA）：改用动态链接的 GPU 版运行库。要用 GPU 得先把原生库与 CUDA 运行时取好：
#   node tools/fetch_sherpa_onnx_libs.mjs --cuda
#     ↑ 除了 sherpa/onnxruntime 自己的 DLL，还会把 cudart / cublas / cublasLt / cudnn /
#       cufft / nvrtc 也放进 lib 目录。缺任何一个，CUDA EP 都加载不起来
#       （error 126 / 127 / 1114），表现成「机器有 GPU 却在跑 CPU」，严重时直接 abort 进程。
# 再把 SHERPA_ONNX_LIB_DIR 指向它，并关掉默认特性（static 与 shared 互斥）：
#   SHERPA_ONNX_LIB_DIR=src-tauri/.sherpa-onnx-libs/1.13.8/cuda-lib \
#     cargo build --no-default-features --features gpu
# 平时不用自己敲这些：`npm run tauri -- build --features gpu` 会自动补上
# SHERPA_ONNX_LIB_DIR、把整目录 DLL 作为 resources 收进安装包，并在打包后跑一次
# CUDA 自检（cargo run --bin verify_cuda_runtime）。
gpu = ["sherpa-onnx/shared"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }
zip = "6.0.0"
tar = "0.4.44"
rayon = "1.10.0"
zstd = { version = "0.13.2", features = ["zstdmt"] }

[profile.release]
# The release binary is very large and pulls in many native dependencies.
# Keeping full debug info in release was causing rustc/LLVM to run out of
# memory on Windows build machines, so release packaging uses a leaner profile.
debug = 0
codegen-units = 16
# 必须保持 unwind，不能改回 abort：文档转换的进程内引擎（anydoc）与 pdf-extract 都依赖
# catch_unwind 隔离第三方解析库的 panic。abort 会让 catch_unwind 失效，遇到畸形文件
# 就直接终止整个应用进程。
panic = "unwind"
strip = "debuginfo"

# dev 构建里唯一必须开优化的依赖：PDF 阅读器每页出图都要跑一次 JPEG 编码，
# 而 image 的编码器是逐像素的纯计算循环 —— 未优化时单页 293ms，一个首屏四页就是
# 1.5 秒纯等待（实测 4 页串行编码 1550ms → 开 O3 后 987ms）。
# 只给这一个依赖开优化：它编译产物独立，不会拖慢其它 crate 的增量构建，
# 也不影响断点调试本项目自己的代码。
[profile.dev.package.image]
opt-level = 3

[dependencies]
tauri = { version = "2.9.5", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
# 离线词典导入：ECDICT 的 CSV 带引号、换行与逗号，必须用真正的 CSV 解析器。
csv = "1.3"
# EWS（本地 Exchange）的 SOAP 请求 / 响应解析；Graph 不需要 XML。
quick-xml = "0.37"
# 命令下发：直接吃参考工具那份 config.yaml（global/targets/tasks 结构）。
serde_yaml = "0.9"
reqwest = { version = "0.11", features = ["blocking", "json", "stream", "multipart", "socks"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"
regex = "1.11.1"
chrono = "0.4.39"
rand = "0.9.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["fmt", "time", "local-time", "json", "env-filter"] }
tracing-appender = "0.2.3"
tauri-plugin-dialog = "2"
pyo3 = "0.23.5"
rusqlite = { version = "0.34.0", features = ["bundled"] }
tauri-plugin-os = "2"
urlencoding = "2.1.3"
base64 = "0.22.1"
tauri-plugin-fs = "2"
pdfium-render = "0.8.37"
pdf-extract = "0.7.8"
lopdf = "0.34.0"
image = "0.25.6"
tauri-plugin-clipboard-manager = "2"
notify = "8.0.0"
actix-web = "4.10.2"
actix-web-actors = "4.2.0"
actix = "0.13.5"
mime_guess = "2.0.5"
actix-cors = "0.7.1"
lazy_static = "1.5.0"
anyhow = "1.0.97"
tauri-plugin-global-shortcut = "2.0.0"
sha2 = "0.10.9"
svg = "0.18.0"
fs_extra = "1.3.0"
hmac = "0.12.1"
hex = "0.4.3"
mockito = "1.7.0"
ignore = "0.4.23"
walkdir = "2.5.0"
# 终端调试工坊日志分析：按需切片百万行大日志，避免整体读进内存。
memmap2 = "0.9.5"
grep-searcher = "0.1.14"
grep-regex = "0.1.13"
grep-matcher = "0.1.7"
rayon = "1.10.0"
parking_lot = "0.12.4"
lru = "0.16.0"
# 差异对比引擎的 diff 算法（Myers / Patience / LCS）
similar = "2.7.0"
uuid = { version = "1.17.0", features = ["v4"] }
git2 = "0.20.2"
encoding_rs = "0.8.35"
zip = "6.0.0"
flate2 = "1.0.30"
tar = "0.4.44"
# sherpa-onnx 官方 ASR 模型以 .tar.bz2 发布。
bzip2 = "0.4.4"
zstd = { version = "0.13.2", features = ["zstdmt"] }
comrak = "0.49.0"
# 系统字体枚举（设置 → 编辑器 → 编辑器外观的字体下拉）。fontdb 本来就是 resvg/usvg 的传递依赖，
# 这里只是提成直接依赖、复用同一份编译产物；它直接解析字体文件，拿到的家族名可写进 CSS font-family。
fontdb = "0.23"
# 文档转换「极速引擎」：纯 Rust 的多格式文档 -> Markdown（Word/PPT/Excel/OpenDocument/RTF/EPUB/CSV
# 以及文本型 PDF）。无 Python、无 ML 模型、无需装配，进程内直调，中位耗时毫秒级。
# 不做 OCR，扫描件会返回 NeedsOcr；调用侧用 catch_unwind 隔离其 panic（见 profile.release 说明）。
anydoc = "0.2.4"
# 电子书解析：MOBI / AZW3（anydoc 不覆盖这两类）。只用来取正文纯文本，
# 默认特性里的 server/opds/mcp/parallel/mmap/zstd 全关掉，避免拖进 tiny_http、
# rayon、memmap2 等与本体无关的重依赖。
ebook-rs = { version = "0.17", default-features = false }
# 表格阅读器：xlsx / xls / ods 的纯 Rust 解析（SheetJS 的 Rust 等价物）。
# 只开读取能力，不启用 picture/dates 等可选特性；zip 版本与 Cargo.lock 里已有的 7.x 系列对齐，
# 避免为此再拉一套 zip 实现进构建图。
calamine = { version = "0.34", default-features = false }
# 语音合成 / 识别：进程内直调，替代原来的 sherpa-onnx CLI 子进程（省掉每段重载模型的开销）。
# 默认 `static` feature 会把官方预编译库静态链接进来，CPU 路径自包含、无需分发 DLL。
# 构建期不让它自己去联网下载——由 tools/fetch_sherpa_onnx_libs.mjs 预取归档，
# 经 src-tauri/.cargo/config.toml 的 SHERPA_ONNX_ARCHIVE_DIR 指过去（见该文件注释）。
# 语音合成 / 识别：进程内直调，替代原来的 sherpa-onnx CLI 子进程（省掉每段重载模型的开销）。
# 默认特性交给本 crate 的 `default`（见 [features]）：CPU 静态库自包含，GPU 走 `gpu` 特性。
# 构建期不让它自己去联网下载——由 tools/fetch_sherpa_onnx_libs.mjs 预取归档，
# 经 src-tauri/.cargo/config.toml 的 SHERPA_ONNX_ARCHIVE_DIR 指过去（见该文件注释）。
sherpa-onnx = { version = "1.13.8", default-features = false }
petgraph = "0.6"
fuzzy-matcher = "0.3.7"
# 文件名索引的模糊匹配器（Helix 编辑器同款）。比 fuzzy-matcher 快一个量级，
# 且自带路径感知打分与查询原子语法（^前缀 $后缀 '精确 !排除）。
nucleo = "0.5.0"
# 正文全文索引。tantivy 负责倒排索引与 BM25 排序，jieba 负责中文分词——
# grep 只能按字面子串命中，分词后「增强 搜索」才能命中同一篇里分散的两个词。
tantivy = "0.26.1"
tantivy-jieba = "0.20.0"
once_cell = "1.21.3"
rss = "2.0.12"
url = "2.5.7"
exif = { git = "https://github.com/kamadak/exif-rs", package = "exif" }
scraper = "0.25.0"
aes-gcm = "0.10.3"
trash = "5.2.5"
rquickjs = "0.11.0"
tempfile = "3.25.0"
portable-pty = "0.9.0"
tree-sitter = "0.26.9"
tree-sitter-highlight = "0.26.9"
tree-sitter-md = "0.5.3"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-bash = "0.25.1"
tree-sitter-lua = "0.5.0"
tree-sitter-java = "0.23.5"
tree-sitter-html = "0.23.2"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
iroh = "1.2.0"
network-interface = "2.0.5"
blake3 = { version = "1.8.5", features = ["mmap"] }
copia = "0.1.3"
texting_robots = "0.2.2"
chromiumoxide = { version = "0.9.1", features = ["fetcher", "native-tls", "zip8"] }

# Typst：纯 Rust 的 .typ → PDF 编译（无 C 依赖，Windows MSVC 直接构建）。
# 所有 typst sub-crate 必须严格同版本。
# fonts=系统字体；embed-fonts=内嵌 Typst 默认字体（LibertinusSerif 正文 / NewCMMath 数学公式 / DejaVuSansMono 代码），
#   不依赖系统是否安装这些字体，修复数学公式与默认正文渲染异常；
# packages=支持 @preview 包（首次用到时联网下载并缓存）。Windows 上 downloads 走 native-tls(schannel)，无需 openssl。
typst = "=0.14.2"
typst-pdf = "=0.14.2"
typst-kit = { version = "=0.14.2", default-features = false, features = ["fonts", "embed-fonts", "packages"] }
# typst-ide：源码 <-> 渲染文档的双向跳转（jump_from_click / jump_from_cursor），供内嵌阅读器双向定位。
typst-ide = "=0.14.2"
comemo = "0.5"
# 纯 Rust SSH 客户端栈（自带,不依赖系统 ssh）。0.45 的 ed25519-dalek v2 与 iroh 的 v3 pre 共存不冲突。
# keys 通过 russh::keys 重导出使用，无需单列 russh-keys。
# 纯 Rust SSH 客户端栈（自带,不依赖系统 ssh）。
# 用 ring 后端而非默认 aws-lc-rs：后者需 NASM 汇编器（Windows 构建机未装）。
# SFTP 文件传输（在 SSH 连接上开 sftp 子系统，纯 Rust）。
russh-sftp = "2"
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
polars = { version = "0.55.2", default-features = false, features = ["lazy", "csv", "strings", "dtype-full"] }
# 串口连接（A3）与二进制/ELF/PE 结构分析（H）。
serialport = "4.6"
goblin = "0.9"
# 分享链接二维码(微信/QQ/手机扫码)。纯 Rust,只开 svg 特性——不引 image,规避额外原生依赖。
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
# 资源嗅探下载引擎：读取系统代理（Windows 注册表 / 各平台），喂给 reqwest::Proxy。
sysproxy = "0.3"
# 磁力/BT 下载：纯 Rust、可嵌入的 BitTorrent 客户端（rustls+ring 后端，无 NASM/openssl）。
librqbit = "8"
# 本地音乐库：读取 MP3/FLAC/M4A 等的 ID3/Vorbis/MP4 标签、时长与内嵌封面。纯 Rust，无原生依赖。
lofty = "0.25"
# 音乐播放器「解灰」引擎：UnblockNeteaseMusic 的 Rust 版。给一首歌跨源(B站/酷我/酷狗)找可播副本。
# 经 cargo tree 验证：不引 openssl-sys，与本项目 reqwest 0.11 共存（自带 0.12/0.13 副本）。禁用 ytdl 源(依赖外部 yt-dlp 二进制)。
unm_engine = "0.4"
unm_engine_bilibili = "0.4"
unm_engine_kuwo = "0.4"
unm_engine_kugou = "0.4"
unm_types = "0.4"
# 网易云 weapi 加密：AES-128-CBC + 文本型(无填充)RSA。纯 Rust，避开 ncmapi 的 openssl 依赖。
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
num-bigint = "0.4"
# 酷狗 web API 签名用 MD5。
md-5 = "0.10"
# 网络工具箱：报文构造/解析(纯 Rust)。
etherparse = "0.16"
hickory-proto = { version = "0.24", default-features = false }
# 计算器工具箱：X.509 证书 / CSR / 公钥 / ASN.1 解析（纯 Rust nom，无 openssl）。
x509-parser = "0.16"
pem = "3.0"
# 网络工具箱 TLS 握手探测：rustls 用 ring 后端(避开 NASM)。
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
# 网络抓包：运行时动态加载 Npcap 的 wpcap.dll(不依赖 SDK 链接库，机器没装则优雅提示)。
libloading = "0.8"

# ============ 证书 / 密钥 / 加解密工作台（纯 Rust；无 openssl / 无 NASM，PKI 走 rcgen+ring）============
# rcgen 用 ring 后端（避开 aws-lc-rs 的 NASM）；RSA 生成走 rsa crate 再喂给 rcgen 签名。
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
# rsa 0.9 的 keygen 需要 rand_core 0.6 的 RNG，项目主 rand 是 0.9，这里单独引 0.8 并重命名避免冲突。
rand08 = { package = "rand", version = "0.8" }
ecdsa = { version = "0.16", features = ["pem"] }
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core", "pem"] }
pkcs8 = { version = "0.10", features = ["pem", "std"] }
pkcs1 = { version = "0.7", features = ["pem"] }
spki = { version = "0.7", features = ["pem"] }
sec1 = { version = "0.7", features = ["pem"] }
signature = "2"
sha1 = "0.10"
ctr = "0.9"
chacha20poly1305 = "0.10"
# 对称算法/模式的补全（全部 pin 在 cipher 0.4 线上，与 aes 0.8 / cbc 0.1 一致）。
# 块密码：SM4 / Camellia / DES / 3DES / Blowfish / CAST5 / RC2 / Twofish / Serpent / IDEA
ecb = "0.1"
cfb-mode = "0.8"
ofb = "0.6"
cipher = "0.4"
sm4 = "0.5"
camellia = "0.1"
cast5 = "0.11"
twofish = "0.7"
serpent = "0.5"
idea = "0.5"
blowfish = "0.9"
rc2 = "0.8"
des = "0.8"
chacha20 = "0.9"
salsa20 = "0.11"
# PKCS#12 / PFX 拆包与打包（纯 Rust：rc2/des/cbc/hmac/sha1）。
p12 = "0.6"
# 证书有效期计算（rcgen 的 not_before/not_after 用 time::OffsetDateTime）。
time = "0.3"
# SM2/TLCP/PQC（可选特性 `tlcp`）：绑定 Tongsuo(铜锁)。默认不启用、不编译，避免无 Tongsuo 时破坏构建。
# 启用需本机装好 Tongsuo 并 OPENSSL_DIR 指向它（勿开 vendored，否则会拉官方 OpenSSL）。
openssl = { version = "0.10", optional = true }
openssl-sys = { version = "0.9", optional = true }
symphonia = { version = "0.6.1", features = ["mp3", "mpa", "aac", "isomp4"] }
mp3lame-encoder = "0.2.5"
imap = { version = "2.4.1", default-features = false }
mail-parser = { version = "0.11.9", features = ["serde", "full_encoding"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname"] }
rustls-native-certs = "0.8.5"
socks = "0.3.4"
ego-tree = "0.10"
# 通知：故意锁在 2.3.x —— 2.4+ 要求 tauri ^2.10，会把 tauri/wry 整体升级。
tauri-plugin-notification = "=2.3.3"
# S/MIME（CMS，RFC 5652）：签名 / 加密用 RustCrypto 的纯 Rust 实现，
# 与项目其余密码学栈（rsa/p256/ed25519/ring）同一套，不引入 openssl。
cms = { version = "0.2.3", default-features = false, features = ["builder", "std", "rsa", "sha1", "pem"] }
x509-cert = { version = "0.2.5", features = ["pem"] }
# CMS / X.509 的 ASN.1 编解码（与 cms、x509-cert 同一版本线；v0.7）。
der = { version = "0.7", features = ["alloc", "oid", "std", "pem"] }
const-oid = { version = "0.9", features = ["db"] }
# OpenPGP（RFC 9580）：纯 Rust。只开标准特性，bzip2 压缩留给服务器决定（关掉以减小构建）。
pgp = { version = "0.21.0", default-features = false, features = ["bzip2"] }
# RSS/Atom 统一解析。`rss` crate 只认 RSS 2.0，遇到 Atom 的 `<feed>` 直接报
# "the input did not begin with an rss tag" —— YouTube、很多个人博客都是 Atom，
# 于是它们全被当成抓取失败。feed-rs 同时支持两者，纯 Rust、不引 openssl/aws-lc。
feed-rs = "3.0.0"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# 直接从 Chrome profile 的 Cookies 库读登录态（免二开浏览器抢占 profile）：
# Local State 里的 AES 主密钥用 DPAPI(CryptUnprotectData) 解开。
windows-sys = { version = "0.59", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    # 电脑操控（commands/computer.rs）：截屏、窗口枚举、鼠标键盘注入、剪贴板。
    # 这些 feature 只影响 windows-sys 的绑定表，不新增任何原生依赖。
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # 电脑操控的 DPI 感知声明。只多加一张绑定表，不新增原生依赖。
    "Win32_UI_HiDpi",
    # Office/WPS 检测：只读 HKCU/HKLM 的 App Paths 与 .docx 关联，
    # 用系统自带注册表 API，不引 winreg 之类的新依赖。
    "Win32_System_Registry",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }
