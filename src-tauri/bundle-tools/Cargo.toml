[package]
name = "guaxi-bundle-tools"
version = "0.1.0"
edition = "2021"
publish = false
description = "Build/install-time helpers for the Guaxi utils bundles"

# 独立 workspace：这些工具只服务打包与安装，不参与 guaxi 应用的依赖图。
# 放进主 crate 的话，`cargo run --bin prepare_utils_zip` 会为了一个 1MB 的
# 工具把 tauri / sherpa / polars 整张图编译一遍，还会被迫处理应用的
# 原生库环境变量（SHERPA_ONNX_*）。
[workspace]

[dependencies]
rayon = "1.10.0"
tar = "0.4.44"
zstd = { version = "0.13.2", features = ["zstdmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.8.5"
# verify_utils_bundle_roundtrip 的冒烟测试工作目录。
tempfile = "3.25.0"

[profile.release]
debug = 0
codegen-units = 16
panic = "unwind"
strip = "debuginfo"
