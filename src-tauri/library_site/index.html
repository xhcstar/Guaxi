<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>挂系 · 库</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- 纸纹 + 微噪背景层：营造档案馆质感，纯 CSS，无图片请求 -->
  <div class="grain" aria-hidden="true"></div>

  <div class="shell">
    <!-- 左轨：库 / 联邦来源 -->
    <aside class="rail" id="rail">
      <div class="rail-brand">
        <span class="brand-glyph">藏</span>
        <span class="brand-word">GUAXI<em>库</em></span>
      </div>

      <nav class="rail-scroll" id="railScroll">
        <div class="rail-group" data-group="local">
          <div class="rail-group-head">本机</div>
          <ul class="lib-list" id="localLibs"></ul>
        </div>
        <div class="rail-group" data-group="federated">
          <div class="rail-group-head">
            联邦来源
            <button class="ghost-btn" id="discoverBtn" title="发现其他设备的库">发现</button>
          </div>
          <ul class="lib-list" id="peerLibs"></ul>
        </div>
      </nav>

      <button class="theme-toggle" id="themeToggle" title="切换主题">
        <span class="tt-dot"></span><span class="tt-label">主题</span>
      </button>
    </aside>

    <!-- 主区 -->
    <main class="stage">
      <header class="masthead" id="masthead">
        <div class="mast-kicker" id="mastKicker">全部资料</div>
        <h1 class="mast-title" id="mastTitle">资料库</h1>
        <div class="mast-meta" id="mastMeta"><span class="mm-count">—</span> 份文档</div>
        <div class="mast-rule"></div>
      </header>

      <div class="searchbar" id="searchbar">
        <div class="search-field">
          <span class="search-prompt">/</span>
          <input id="q" type="text" autocomplete="off" spellcheck="false"
                 placeholder="检索标题与正文… 支持中文分词" />
          <kbd class="search-kbd" id="searchKbd">↵</kbd>
        </div>
        <div class="toolbar">
          <div class="tb-mode" id="tbMode">
            <button class="tb-seg is-on" data-mode="browse">浏览</button>
            <button class="tb-seg" data-mode="search">检索</button>
          </div>
          <div class="tb-spacer"></div>
          <div class="tb-sort" id="tbSort">
            <button class="tb-seg is-on" data-sort="mtime">最近</button>
            <button class="tb-seg" data-sort="name">名称</button>
            <button class="tb-seg" data-sort="size">大小</button>
          </div>
        </div>
      </div>

      <!-- 虚拟滚动视口：只渲染可视窗口的行 -->
      <div class="viewport" id="viewport">
        <div class="vp-spacer" id="vpSpacer"></div>
        <ul class="rows" id="rows"></ul>
        <div class="vp-empty" id="vpEmpty" hidden>
          <div class="empty-glyph">∅</div>
          <p class="empty-text">这里还没有文档</p>
        </div>
        <div class="vp-loading" id="vpLoading" hidden>
          <span class="spin"></span> 正在读取索引…
        </div>
      </div>
    </main>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
