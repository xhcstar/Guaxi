name: Release

on:
  push:
    tags:
      - "v*"
  # 重新发布已存在的版本（例如修好构建后重发 v0.1.1）：填 publish_tag 即可，
  # 不必改写 tag。留空则只构建、不发布。
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "发布到指定 tag（例如 v0.1.1）；留空只构建不发布"
        required: false
        default: ""

permissions:
  contents: write

env:
  CI: true
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Windows x64 完整离线包
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-x64

      # 语音模型（kokoro TTS / SenseVoice ASR / whisper / 标点）与 sherpa-onnx 原生库，
      # 合计约 1 GB。缓存键带上取模型的脚本摘要：下载清单一变，旧缓存自动失效，
      # 不会出现「新模型被旧缓存挡住、打进包里的还是老一套」。
      - name: Cache speech libs and models
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/.sherpa-onnx-libs
            src-tauri/utils/Models
          key: sherpa-1.13.8-windows-x64-${{ hashFiles('tools/fetch_sherpa_onnx_libs.mjs') }}

      # RSSHub 要 clone + pnpm install + build，十几分钟起步。缓存里已有 dist 时
      # tools/prepare_rsshub_env.mjs 会直接跳过。想强制换一版 RSSHub 就改这里的版本号。
      - name: Cache RSSHub build
        uses: actions/cache@v4
        with:
          path: src-tauri/utils/rsshub
          key: rsshub-v1-${{ hashFiles('tools/prepare_rsshub_env.mjs') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare PDFium runtime
        run: npm run prepare:pdfium

      # 一条命令走完整条链：语音库与模型预取 → Codex 侧车 → 静态资源 → RSSHub →
      # utils 外置分包（此时已包含语音模型）→ extract_utils_bundles.exe → tauri build →
      # 把 utils_bundles/、helper、README 发布到 bundle/nsis/。
      # 这里刻意不再设置 SHERPA_SKIP_MODELS / RSSHUB_SKIP：少了模型和 RSSHub 的包，
      # 用户装完是残缺的，必须在 CI 里就构建完整。
      - name: Build full installer and external bundles
        run: npm run tauri -- build

      # RSSHub 缺失只会让聚合功能降级，构建本身不会失败；但发版时需要知道
      # 这一版到底带没带它，所以在日志里明确标出来（::warning:: 会显示在 Actions 摘要里）。
      - name: Report optional components
        shell: pwsh
        run: |
          $models = Get-ChildItem 'src-tauri/utils/Models' -Recurse -Filter '*.onnx' -File -ErrorAction SilentlyContinue
          if (-not $models) {
            throw '未找到任何 .onnx 语音模型，这个包是残缺的，不应发布。'
          }
          Write-Host ("[verify] 语音模型 {0} 个 · {1:N1} MB" -f $models.Count, (($models | Measure-Object Length -Sum).Sum / 1MB))
          if (Test-Path 'src-tauri/utils/rsshub/dist/index.mjs') {
            Write-Host '[verify] RSSHub 已打进包'
          } else {
            Write-Host '::warning::RSSHub 未构建成功，本版安装包的聚合功能会降级（其余功能不受影响）'
          }

      # 发布目录里是一堆并列的文件（setup.exe + utils_bundles/ + helper + README），
      # 必须整目录一起分发。脚本负责校验完整性、打 7z 分卷（每卷 < 2 GiB）、写 SHA-256。
      - name: Package split release archive
        shell: pwsh
        env:
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            ./tools/package_release.ps1 -Tag $env:GITHUB_REF_NAME
          } elseif ($env:PUBLISH_TAG) {
            ./tools/package_release.ps1 -Tag $env:PUBLISH_TAG
          } else {
            ./tools/package_release.ps1
          }

      # 手动触发且不发布时只留构建产物，方便验证；tag 构建与「重发」直接进 Release，
      # 不走 Artifact 往返（几 GB 上传再下载一次纯属浪费）。
      - name: Upload build for manual runs
        if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.publish_tag == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: guaxi-windows-x64-full
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0

      # 重新发布旧版本时，旧流程留下的 guaxi-*-windows-x64.zip（缺模型的那一份）
      # 和上一次残留的分卷必须先清掉，否则用户会在下载页看到两套互相矛盾的包。
      - name: Drop stale release assets
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.publish_tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG 还不存在，无需清理"
            exit 0
          fi
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | while read -r name; do
            case "$name" in
              guaxi-*-windows-x64.zip|guaxi-*-windows-x64-full.7z*)
                echo "删除旧资产：$name"
                gh release delete-asset "$RELEASE_TAG" "$name" -y
                ;;
            esac
          done

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.publish_tag || github.ref_name }}
          files: release-assets/*
          body_path: release-notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          overwrite_files: true
